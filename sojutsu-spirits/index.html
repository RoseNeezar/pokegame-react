<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1018" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="SOJUTSU-SPIRITS — bind cursed spirits, hold the chain, and settle what the world stopped counting."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1018'/%3E%3Cpath d='M8 22 L22 8 M19 8 h4 v4' stroke='%2374d8f0' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='10' cy='22' r='2.5' fill='%232fc6b0'/%3E%3C/svg%3E"
    />
    <title>SOJUTSU-SPIRITS</title>
    <style>
      :root {
        color-scheme: dark;
        --deck: #0a1018;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--deck);
        /* The game owns every gesture: no pull-to-refresh, no double-tap zoom, no text select. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Shown until Phaser boots, and replaced by the Boot scene's own title card. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--deck);
        color: #9aa3b0;
        font: 500 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 0.4s ease;
      }
      #boot[hidden] {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Counting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
